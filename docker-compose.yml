services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - .:/app
      - ollama_models:/root/.cache/huggingface

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-setup:
    image: curlimages/curl:latest
    depends_on:
      - ollama
    volumes:
      - ./Modelfile:/Modelfile
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama to start..."
        until curl -s http://ollama:11434/api/tags > /dev/null; do sleep 2; done
        echo "Ollama is up."
        # Use $$ for shell variables to prevent Docker Compose from interpolating them
        OLLAMA_MODEL_NAME="gemma4:e2b"
        echo "Checking if model $$OLLAMA_MODEL_NAME exists..."
        if curl -s http://ollama:11434/api/tags | grep -q "$$OLLAMA_MODEL_NAME"; then
          echo "Model already exists. Skipping creation."
        else
          echo "Pulling base model (gemma:2b)..."
          curl -X POST http://ollama:11434/api/pull -d '{"name": "gemma:2b"}'
          echo "Creating $$OLLAMA_MODEL_NAME from Modelfile..."
          MODELEFILE_RAW=$$(cat /Modelfile)
          # Escape for JSON and handle newlines
          MODELEFILE_ESCAPED=$$(echo "$$MODELEFILE_RAW" | sed 's/"/\\"/g' | awk '{printf "%s\\n", $$0}' | tr -d '\r')
          curl -X POST http://ollama:11434/api/create -d "{
            \"name\": \"$$OLLAMA_MODEL_NAME\",
            \"modelfile\": \"$$MODELEFILE_ESCAPED\"
          }"
          echo "Model created."
        fi

volumes:
  ollama_data:
  ollama_models:
