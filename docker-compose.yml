services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - .:/app
      - ollama_models:/root/.cache/huggingface

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-setup:
    image: ollama/ollama:latest
    pull_policy: always
    depends_on:
      - ollama
    volumes:
      - ./Modelfile:/Modelfile
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama to start..."
        until ollama list > /dev/null 2>&1; do sleep 2; done
        
        echo "Current Ollama version:"
        ollama --version
        
        echo "Ensuring base model gemma4:e2b is available..."
        # If this fails with a version error, the pull_policy above should have fixed it
        # by giving us the actual latest Ollama binary.
        ollama pull gemma4:e2b || echo "Pull failed. Checking local models..."
        
        echo "Applying Modelfile customizations..."
        ollama create gemma4:e2b -f /Modelfile
        echo "Model update complete."

volumes:
  ollama_data:
  ollama_models:
