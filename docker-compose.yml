version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - .:/app
      - ollama_models:/root/.cache/huggingface

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-setup:
    image: curlimages/curl:latest
    depends_on:
      - ollama
    volumes:
      - ./Modelfile:/Modelfile
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama to start..."
        until curl -s http://ollama:11434/api/tags > /dev/null; do sleep 2; done
        echo "Ollama is up. Pulling base model..."
        curl -X POST http://ollama:11434/api/pull -d '{"name": "gemma:2b"}'
        echo "Creating gemma4:e2b from Modelfile..."
        # Read Modelfile and escape it for JSON
        MODELEFILE_CONTENT=$(cat /Modelfile)
        curl -X POST http://ollama:11434/api/create -d "{
          \"name\": \"gemma4:e2b\",
          \"modelfile\": \"$(echo "$MODELEFILE_CONTENT" | sed 's/"/\\"/g' | awk '{printf "%s\\n", $0}')\"
        }"
        echo "Model gemma4:e2b created successfully."

volumes:
  ollama_data:
  ollama_models:
