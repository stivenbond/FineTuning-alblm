version: '3.8'

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - AI_BACKEND=ollama
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=gemma:2b
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - .:/app
    restart: always

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  ollama-setup:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling production model: $$OLLAMA_MODEL"
        ollama pull $$OLLAMA_MODEL
        echo "Setup complete."


volumes:
  ollama_data:
