<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lahuta Task Engine Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --card-bg: rgba(23, 28, 38, 0.8);
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.4);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem; }
        h1 { font-size: 2rem; font-weight: 600; background: linear-gradient(to right, #a855f7, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        nav { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
        nav button { background: none; border: none; color: var(--text-muted); font-size: 1rem; cursor: pointer; padding: 0.5rem 1rem; transition: all 0.3s; }
        nav button.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: var(--card-bg); border: 1px solid var(--border); padding: 1.5rem; border-radius: 16px; margin-bottom: 1.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }

        .api-key-section { background: var(--card-bg); border: 1px solid var(--border); padding: 0.5rem; border-radius: 12px; display: flex; gap: 0.5rem; }
        input, textarea, select { background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border); color: var(--text); padding: 0.75rem; border-radius: 8px; outline: none; width: 100%; }
        button { background: var(--accent); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px var(--accent-glow); }
        button.secondary { background: rgba(255, 255, 255, 0.1); }

        .task-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid var(--border); }
        .task-info h4 { color: var(--accent); margin-bottom: 0.25rem; }
        .task-info p { font-size: 0.875rem; color: var(--text-muted); }

        .stat-val { font-size: 2rem; font-weight: 600; margin-top: 0.5rem; }

        .toast { position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 2rem; border-radius: 8px; background: var(--success); color: white; transform: translateY(100px); transition: transform 0.3s; z-index: 1000; }
        .toast.show { transform: translateY(0); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Lahuta Task Engine</h1>
                <p id="healthStatus" style="color: var(--text-muted)">Connecting...</p>
            </div>
            <div class="api-key-section">
                <input type="password" id="apiKey" placeholder="Admin API Key" style="width: 200px">
                <button onclick="refreshAll()">Connect</button>
            </div>
        </header>

        <nav>
            <button id="btn-stats" class="active" onclick="switchTab('stats')">Statistics</button>
            <button id="btn-tasks" onclick="switchTab('tasks')">Task Manager</button>
            <button id="btn-rlhf" onclick="switchTab('rlhf')">RLHF & Feedback</button>
        </nav>

        <!-- Stats Tab -->
        <div id="tab-stats" class="tab-content active">
            <div class="grid" id="statsGrid">
                <div class="card"><h3>Tasks Configured</h3><div class="stat-val" id="stat-tasks">-</div></div>
                <div class="card"><h3>Total Feedback</h3><div class="stat-val" id="stat-feedback">-</div></div>
                <div class="card"><h3>Uptime</h3><div class="stat-val" id="stat-uptime">-</div></div>
            </div>
        </div>

        <!-- Tasks Tab -->
        <div id="tab-tasks" class="tab-content">
            <div class="grid">
                <div class="card">
                    <h3>Create / Update Task</h3>
                    <div style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem">
                        <input id="t-id" placeholder="Task ID (e.g. summarizer)">
                        <input id="t-name" placeholder="Friendly Name">
                        <textarea id="t-desc" placeholder="Description"></textarea>
                        <textarea id="t-prompt" style="min-height: 150px" placeholder="System Prompt"></textarea>
                        <textarea id="t-schema" placeholder="Output Schema (JSON, optional)"></textarea>
                        <button onclick="upsertTask()">Save Task</button>
                    </div>
                </div>
                <div class="card">
                    <h3>Existing Tasks</h3>
                    <div id="taskList" style="margin-top: 1rem"></div>
                </div>
            </div>
        </div>

        <!-- RLHF Tab -->
        <div id="tab-rlhf" class="tab-content">
            <div class="card">
                <h3>Feedback Analytics</h3>
                <div id="feedbackTable" style="margin-top: 1rem"></div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Action successful!</div>

    <script>
        async function apiFetch(endpoint, method = 'GET', body = null) {
            const key = document.getElementById('apiKey').value;
            const options = {
                method,
                headers: { 'x-api-key': key, 'Content-Type': 'application/json' }
            };
            if (body) options.body = JSON.stringify(body);
            const resp = await fetch(endpoint, options);
            if (!resp.ok) {
                const err = await resp.json();
                throw new Error(err.detail || 'API Error');
            }
            return resp.json();
        }

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.background = isError ? 'var(--danger)' : 'var(--success)';
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`btn-${tab}`).classList.add('active');
        }

        async function refreshAll() {
            try {
                const health = await apiFetch('/health');
                document.getElementById('healthStatus').textContent = `Connected • ${health.base_model_loaded ? 'Model Loaded' : 'No Model'}`;
                document.getElementById('stat-uptime').textContent = `${Math.floor(health.uptime_seconds / 3600)}h ${Math.floor((health.uptime_seconds % 3600) / 60)}m`;
                
                const tasks = await apiFetch('/tasks');
                renderTasks(tasks);
                document.getElementById('stat-tasks').textContent = tasks.length;

                const stats = await apiFetch('/rlhf/stats');
                renderStats(stats);
                
                localStorage.setItem('lahuta_admin_key', document.getElementById('apiKey').value);
            } catch (err) {
                showToast(err.message, true);
            }
        }

        function renderTasks(tasks) {
            const list = document.getElementById('taskList');
            list.innerHTML = tasks.map(t => `
                <div class="task-item">
                    <div class="task-info">
                        <h4>${t.id}</h4>
                        <p>${t.name}</p>
                    </div>
                    <div style="display: flex; gap: 0.5rem">
                        <button class="secondary" onclick="editTask('${t.id}')">Edit</button>
                        <button class="secondary" style="color: var(--danger)" onclick="deleteTask('${t.id}')">Delete</button>
                    </div>
                </div>
            `).join('');
            
            // Store tasks globally for editing
            window._tasks = tasks;
        }

        async function editTask(id) {
            const task = window._tasks.find(x => x.id === id);
            if (!task) return;
            
            document.getElementById('t-id').value = task.id;
            document.getElementById('t-name').value = task.name;
            document.getElementById('t-desc').value = task.description || '';
            document.getElementById('t-prompt').value = task.system_prompt || '';
            document.getElementById('t-schema').value = task.output_schema ? JSON.stringify(task.output_schema, null, 2) : '';
        }


        async function upsertTask() {
            const payload = {
                id: document.getElementById('t-id').value,
                name: document.getElementById('t-name').value,
                system_prompt: document.getElementById('t-prompt').value,
                description: document.getElementById('t-desc').value,
                output_schema: document.getElementById('t-schema').value ? JSON.parse(document.getElementById('t-schema').value) : null
            };
            try {
                await apiFetch('/tasks', 'POST', payload);
                showToast('Task saved!');
                refreshAll();
            } catch (e) { showToast(e.message, true); }
        }

        async function deleteTask(id) {
            if (!confirm('Delete task?')) return;
            try {
                await apiFetch(`/tasks/${id}`, 'DELETE');
                showToast('Task deleted');
                refreshAll();
            } catch (e) { showToast(e.message, true); }
        }

        function renderStats(stats) {
            const container = document.getElementById('feedbackTable');
            let total = 0;
            let html = '<table style="width: 100%; text-align: left; border-collapse: collapse;">';
            html += '<tr><th>Task</th><th>Rating</th><th>Count</th></tr>';
            Object.entries(stats).forEach(([tid, ratings]) => {
                Object.entries(ratings).forEach(([r, count]) => {
                    html += `<tr><td>${tid}</td><td>${r}</td><td>${count}</td></tr>`;
                    total += count;
                });
            });
            html += '</table>';
            container.innerHTML = html;
            document.getElementById('stat-feedback').textContent = total;
        }

        window.onload = () => {
            const saved = localStorage.getItem('lahuta_admin_key');
            if (saved) {
                document.getElementById('apiKey').value = saved;
                refreshAll();
            }
        };
    </script>
</body>
</html>
